name: Temporary CSharpier formatting for audit PR

on:
  pull_request:
    paths:
      - '.github/workflows/temp-csharpier-autofix-20261107.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Format and commit only modified CSharp files
        shell: bash
        run: |
          set -euo pipefail
          dotnet csharpier format .
          git diff --check
          git add -- '*.cs'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply CSharpier to audit PR #17 changes"
          git push origin HEAD:"${{ github.head_ref }}"
