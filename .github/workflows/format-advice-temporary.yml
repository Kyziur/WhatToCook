name: Temporary CSharpier advice
on:
  pull_request:
    paths:
      - tests/WhatToCook.Api.IntegrationTests/Specs/BrowserMutationGuardSpecificationTests.cs
      - .github/workflows/format-advice-temporary.yml

permissions:
  contents: read

jobs:
  format-advice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Format copy and show exact diff (no commit)
        run: |
          dotnet csharpier format tests/WhatToCook.Api.IntegrationTests/Specs/BrowserMutationGuardSpecificationTests.cs
          git diff -- tests/WhatToCook.Api.IntegrationTests/Specs/BrowserMutationGuardSpecificationTests.cs
