name: Publish immutable WhatToCook images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-whattocook-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: src/WhatToCook.Api/Dockerfile
          - service: web
            dockerfile: src/WhatToCook.Web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kyziur/whattocook-${{ matrix.service }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable digest for manual promotion
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SERVICE: ${{ matrix.service }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -n "$DIGEST"
          printf 'Image: `ghcr.io/kyziur/whattocook-%s@%s`\nSource: `%s`\n' "$SERVICE" "$DIGEST" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
