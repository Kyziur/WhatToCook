name: PR CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore .NET tools
        run: dotnet tool restore

      # Fail quickly on style regressions instead of waiting for the full Testcontainers + Playwright suite.
      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore .NET packages
        run: dotnet restore WhatToCook.slnx

      - name: Build
        run: dotnet build WhatToCook.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WhatToCook.slnx --no-build --configuration Release

      - name: Profile recipe details query shape (non-gating timings)
        run: |
          dotnet test tests/WhatToCook.Api.IntegrationTests/WhatToCook.Api.IntegrationTests.csproj \
            --no-build --configuration Release \
            --filter "FullyQualifiedName~RecipeDetailsQueryDiagnosticsTests" \
            --logger "console;verbosity=detailed"

      - name: Inspect title substring PostgreSQL plans (non-gating timings)
        run: |
          dotnet test tests/WhatToCook.Api.IntegrationTests/WhatToCook.Api.IntegrationTests.csproj \
            --no-build --configuration Release \
            --filter "FullyQualifiedName~RecipeSubstringSearchDiagnosticsTests" \
            --logger "console;verbosity=detailed"

      - name: Install Playwright dependencies
        run: npm ci && npx playwright install --with-deps chromium
        shell: bash

      - name: Playwright smoke suite
        run: PLAYWRIGHT_HTML_OPEN=never npx playwright test --config=playwright.config.ts
        shell: bash
        env:
          PLAYWRIGHT_DOTNET_CONFIGURATION: Release

      - name: Validate agent MCP configuration
        run: node --test tests/ci/repowise-config.test.mjs

      - name: Test NuGet audit policy
        run: node --test tests/ci/nuget-audit-gate.test.mjs

      - name: Audit .NET dependencies
        run: |
          dotnet package list --project WhatToCook.slnx --vulnerable --include-transitive --no-restore --format json --output-version 1 > nuget-audit.json
          node scripts/ci/check-nuget-audit.mjs nuget-audit.json

      - name: Audit npm dependencies
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Preserve dependency audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audits
          path: |
            nuget-audit.json
            npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  arm64-image-storage:
    name: ARM64 recipe image upload smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WhatToCook.slnx

      - name: Build integration tests
        run: dotnet build tests/WhatToCook.Api.IntegrationTests/WhatToCook.Api.IntegrationTests.csproj --no-restore --configuration Release

      - name: Exercise native image formats and validation
        run: |
          dotnet test tests/WhatToCook.Api.IntegrationTests/WhatToCook.Api.IntegrationTests.csproj \
            --no-build --configuration Release \
            --filter "FullyQualifiedName~UploadingSupportedRasterFormats|FullyQualifiedName~SaveRecipeWithUploadedPhoto_ShouldStoreMainPhotoPath|FullyQualifiedName~UploadingAnInvalidImageHeader_ShouldBeRejected"
