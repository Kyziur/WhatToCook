name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    outputs:
      application: ${{ steps.scope.outputs.application }}
      image: ${{ steps.scope.outputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select relevant verification
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=ALL
          else
            changed="$(git diff --no-renames --name-only "$BASE_SHA" HEAD)"
          fi
          relevant() { [ "$changed" = ALL ] || grep -Eq "$1" <<<"$changed"; }
          # Komodo-only edits are checked by the separate resource-sync contract workflow.
          # Keep any other deploy/ input (and unknown base) on the full app CI path.
          application_changed="$(grep -v '^deploy/komodo[.]toml$' <<<"$changed" || true)"
          if [ "$changed" = ALL ] || grep -Eq '^(src/|tests/|scripts/|deploy/|[.]config/|[.]github/workflows/pr-ci[.]yml|playwright[.]config[.]ts|package(-lock)?[.]json|global[.]json|dotnet-tools[.]json|[.]dockerignore|.*[.](slnx|csproj|props)|[.]editorconfig)' <<<"$application_changed"; then echo "application=true" >> "$GITHUB_OUTPUT"; else echo "application=false" >> "$GITHUB_OUTPUT"; fi
          if relevant '^([.]agents/|[.]github/agents/|[.]omp/|AGENTS[.]md|[.]mcp[.]json|skills-lock[.]json|docs/audits/|[.]github/workflows/pr-ci[.]yml)'; then echo "guidance=true" >> "$GITHUB_OUTPUT"; else echo "guidance=false" >> "$GITHUB_OUTPUT"; fi
          if relevant '^(src/WhatToCook[.]Api/|tests/WhatToCook[.]Api[.]IntegrationTests/|global[.]json|[.]github/workflows/pr-ci[.]yml|.*[.](csproj|props))'; then echo "image=true" >> "$GITHUB_OUTPUT"; else echo "image=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup .NET
        if: steps.scope.outputs.application == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        if: steps.scope.outputs.application == 'true' || steps.scope.outputs.guidance == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore .NET tools
        if: steps.scope.outputs.application == 'true'
        run: dotnet tool restore

      # Fail quickly on style regressions instead of waiting for the full Testcontainers + Playwright suite.
      - name: Check formatting
        if: steps.scope.outputs.application == 'true'
        run: dotnet csharpier check .

      - name: Validate image probe helpers
        if: steps.scope.outputs.application == 'true'
        run: |
          node --check scripts/perf/measure-image-transfer.mjs
          node --test tests/ci/image-transfer-metrics.test.mjs

      - name: Restore .NET packages
        if: steps.scope.outputs.application == 'true'
        run: dotnet restore WhatToCook.slnx

      - name: Build
        if: steps.scope.outputs.application == 'true'
        run: dotnet build WhatToCook.slnx --no-restore --configuration Release

      - name: Test
        if: steps.scope.outputs.application == 'true'
        run: dotnet test WhatToCook.slnx --no-build --configuration Release

      # Real-Docker hook tests need root and a Docker daemon; ubuntu-latest provides both.
      # WTC_REQUIRE_REAL_DOCKER=1 turns any missing prerequisite into a failure, not a skip.
      - name: Test pre-deploy hook
        if: steps.scope.outputs.application == 'true'
        env:
          WTC_REQUIRE_REAL_DOCKER: "1"
        run: sudo -E python3 -m unittest discover -s scripts/prepare-what-to-cook -p 'test_*.py' -v
        shell: bash

      - name: Install Playwright dependencies
        if: steps.scope.outputs.application == 'true'
        run: npm ci && npx playwright install --with-deps chromium
        shell: bash

      - name: Verify PERF-06 probe against an isolated browser image fixture
        if: steps.scope.outputs.application == 'true'
        run: node --test tests/ci/image-transfer-browser.test.mjs

      - name: Playwright smoke suite
        id: playwright
        if: steps.scope.outputs.application == 'true'
        run: PLAYWRIGHT_HTML_OPEN=never npx playwright test --config=playwright.config.ts
        shell: bash
        env:
          PLAYWRIGHT_DOTNET_CONFIGURATION: Release

      # Traces, screenshots and videos are kept by playwright.config.ts only for failed tests.
      # Synthetic test data only; short retention bounds the stored artifacts.
      - name: Preserve Playwright failure artifacts
        if: ${{ always() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: tests/e2e/artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Validate agent guidance and audit tracker
        if: steps.scope.outputs.application == 'true' || steps.scope.outputs.guidance == 'true'
        run: node --test tests/ci/audit-tracker.test.mjs tests/ci/repowise-config.test.mjs tests/ci/agent-skill-references.test.mjs tests/ci/openspec-harness-contract.test.mjs

      - name: Test NuGet audit policy
        if: steps.scope.outputs.application == 'true'
        run: node --test tests/ci/nuget-audit-gate.test.mjs

      - name: Audit .NET dependencies
        if: steps.scope.outputs.application == 'true'
        run: |
          dotnet package list --project WhatToCook.slnx --vulnerable --include-transitive --no-restore --format json --output-version 1 > nuget-audit.json
          node scripts/ci/check-nuget-audit.mjs nuget-audit.json

      - name: Audit npm dependencies
        if: steps.scope.outputs.application == 'true'
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Preserve dependency audit reports
        if: ${{ always() && steps.scope.outputs.application == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audits
          path: |
            nuget-audit.json
            npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  arm64-image-storage:
    needs: verify
    if: needs.verify.outputs.image == 'true'
    name: ARM64 recipe image upload smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WhatToCook.slnx

      - name: Build integration tests
        run: dotnet build tests/WhatToCook.Api.IntegrationTests/WhatToCook.Api.IntegrationTests.csproj --no-restore --configuration Release

      - name: Exercise native image formats and validation
        run: |
          dotnet test tests/WhatToCook.Api.IntegrationTests/WhatToCook.Api.IntegrationTests.csproj \
            --no-build --configuration Release \
            --filter "FullyQualifiedName~UploadingSupportedRasterFormats|FullyQualifiedName~SaveRecipeWithUploadedPhoto_ShouldStoreMainPhotoPath|FullyQualifiedName~UploadingAnInvalidImageHeader_ShouldBeRejected"
