name: komodo-resource-sync-contract

on:
  pull_request:
    paths:
      - "deploy/komodo.toml"
      - "deploy/docker-compose.yml"
      - "scripts/prepare-what-to-cook/**"
      - "scripts/test-komodo-owner.py"
      - ".github/workflows/komodo-resource-sync-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate isolated GitOps ownership and persistence contract
        run: python3 scripts/test-komodo-owner.py -v
