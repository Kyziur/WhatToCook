name: Temporary npm lockfile generator
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/a11y-lock-temporary.yml
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm v10 lock from pinned dependency
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'BEGIN_BASE64_LOCK'
          base64 -w 0 package-lock.json
          echo ''
          echo 'END_BASE64_LOCK'
