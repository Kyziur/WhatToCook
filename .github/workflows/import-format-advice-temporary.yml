name: Temporary import formatting advice
on:
  pull_request:
    paths:
      - src/WhatToCook.Api/Features/Recipes/Imports/RecipeImportService.cs
      - src/WhatToCook.Web/Components/Features/Recipes/Import/Services/RecipeImportFailureGuidance.cs
      - .github/workflows/import-format-advice-temporary.yml
permissions:
  contents: read
jobs:
  format-advice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Format copies and show diff
        run: |
          dotnet csharpier format src/WhatToCook.Api/Features/Recipes/Imports/RecipeImportService.cs src/WhatToCook.Web/Components/Features/Recipes/Import/Services/RecipeImportFailureGuidance.cs
          git diff -- src/WhatToCook.Api/Features/Recipes/Imports/RecipeImportService.cs src/WhatToCook.Web/Components/Features/Recipes/Import/Services/RecipeImportFailureGuidance.cs
