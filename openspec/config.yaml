schema: spec-driven
context: |
  WhatToCook is a self-hosted household recipe catalog, weekly meal planner,
  shopping-list manager, and supported-source recipe importer. It is a product,
  not a reusable application template.

  Application stack:
  - .NET 10 ASP.NET Core Minimal API under src/WhatToCook.Api
  - Blazor Interactive Server under src/WhatToCook.Web
  - EF Core with PostgreSQL; migrations in the API project
  - Aspire app host for local development; Compose for deployment
  - API integration tests (PostgreSQL/Testcontainers), Blazor component tests,
    and Playwright browser tests

  Architecture and ownership:
  - Prefer feature-local vertical slices, small services, and straightforward
    HTTP endpoints over generic layers or speculative abstractions.
  - Keep persistence and validation semantics explicit, especially for recipe
    writes, import drafts, plan updates, and shopping-list regeneration.
  - Preserve API contracts and shopping-list state during refactors.
  - The homelab repository owns Komodo, edge/network access, secrets, backups,
    and host setup. This repository owns application code, tests, and the
    deployment Compose contract. Do not move homelab secrets into this repo.

  Delivery:
  - Review current code and relevant docs/audits before choosing a fix.
  - Small changes should stay focused and independently mergeable.
  - Follow AGENTS.md verification workflow. Test behavior changes at the
    lowest useful layer and at the HTTP boundary when contracts change.
  - Keep OpenSpec scenario traceability aligned with implementation; leave
    design-only changes unimplemented until explicitly selected.
  - Verify production-host behavior separately from CI, particularly image
    storage, PostgreSQL persistence, and ARM64 deployment.

rules:
  proposal:
    - Keep the proposal short and practical.
    - State the user-facing or maintainer-facing outcome clearly.
    - Always include scope boundaries or non-goals when relevant.
    - Call out effects on API, Web, persistence, or homelab integration when a change crosses boundaries.

  design:
    - Create design detail only when there is real architectural choice, cross-cutting impact, or risk.
    - Prefer concrete structure and tradeoffs over long narrative text.
    - Explicitly mention implications for the Minimal API, Blazor Web, PostgreSQL, or deployment contract when a change crosses them.
    - If the change affects agent workflow, testing strategy, bootstrap flow, or repository conventions, document that clearly.

  tasks:
    - Break work into small, verifiable tasks.
    - Each task should describe a concrete outcome, not just an area to think about.
    - Include tests whenever behavior changes.
    - Keep task ordering implementation-friendly so a single implementation worker can usually execute them end-to-end.
    - Only split tasks by backend, client, or platform when the ownership boundary is genuinely clear.

  archive:
    - Archive only changes whose required artifacts and tasks are complete; incomplete work stays active.
    - Synchronize and validate every delta spec against main specs before moving a change to archive.
    - Never archive with unsynchronized deltas or by bypassing the required specification sync.
